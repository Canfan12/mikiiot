<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Dashboard</title>
    <!-- Tailwind CSS (CDN for simple vanilla usage) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Phosphor Icons (Alternative to Lucide for easy CDN usage) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0F1113] text-[#E0E0E0] font-sans antialiased min-h-screen flex flex-col">
    <!-- Header -->
    <header class="h-[60px] p-4 md:px-6 md:py-0 border-b border-[#2A2D31] flex flex-row justify-between items-center gap-4 shrink-0 w-full">
        <div class="flex flex-col justify-center">
            <h1 class="text-[10px] font-bold tracking-[0.2em] text-[#8E9299] uppercase leading-none">IOT INFRASTRUCTURE / ESP 32</h1>
            <div class="text-sm sm:text-lg font-light mt-1 flex items-center tracking-wide leading-none">
                Caniago Smart Home Interface 
                <span id="connection-status" class="text-[#00FF41] text-[9px] sm:text-[10px] align-top ml-2 flex items-center bg-[#00FF41]/10 px-2 py-0.5 rounded-full border border-[#00FF41]/20 h-fit self-center">
                    <span class="w-1.5 h-1.5 bg-[#00FF41] rounded-full mr-1.5 animate-pulse"></span> ONLINE
                </span>
            </div>
        </div>
        <div class="hidden sm:flex gap-4 sm:gap-8 text-right flex-wrap items-center">
            <div class="flex flex-col">
                <span class="text-[9px] uppercase text-[#8E9299] tracking-wider leading-none">Network SSID</span>
                <span class="font-mono text-xs text-[#E0E0E0] mt-1 leading-none">miki</span>
            </div>
            <div class="flex flex-col text-right">
                <span class="text-[9px] uppercase text-[#8E9299] tracking-wider leading-none">Telegram Bot</span>
                <span id="telegram-status" class="font-mono text-xs text-[#00FF41] flex items-center gap-1.5 mt-1 leading-none">
                    <i class="ph ph-telegram-logo text-sm"></i> @Active_Relay_Bot
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-6 flex flex-col gap-6">
        
        <!-- Relays Section (Top) -->
        <div class="bg-[#16191D]/80 backdrop-blur-md border border-[#2A2D31] rounded-xl p-5 sm:p-6 shadow-2xl relative w-full h-[230px] flex flex-col">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <h2 class="text-[10px] sm:text-xs font-semibold uppercase tracking-widest text-[#8E9299] flex items-center gap-2">
                    <i class="ph ph-lightning text-[#00FF41]"></i> Power Management (4-Channel)
                </h2>
                <div class="flex gap-2 w-full sm:w-auto flex-wrap items-center">
                    <button onclick="app.setAllRelays(true)" class="flex-1 sm:flex-none text-[10px] sm:text-xs font-bold uppercase tracking-wider bg-[#1A1D21] hover:bg-[#2A2D31] border border-[#2A2D31] text-white px-3 py-1.5 rounded transition-colors">All ON</button>
                    <button onclick="app.setAllRelays(false)" class="flex-1 sm:flex-none text-[10px] sm:text-xs font-bold uppercase tracking-wider bg-[#FF4B2B]/20 hover:bg-[#FF4B2B]/30 border border-[#FF4B2B]/50 text-[#FF4B2B] px-3 py-1.5 rounded transition-colors">All OFF</button>
                    
                    <div class="w-full sm:w-px sm:h-6 bg-[#3A3D41] mx-0 sm:mx-1 hidden sm:block"></div>
                    
                    <button onclick="app.setVariasi(1)" id="btn-var1" class="flex-1 sm:flex-none text-[10px] sm:text-xs font-bold uppercase tracking-wider bg-[#00A8E8]/20 hover:bg-[#00A8E8]/30 border border-[#00A8E8]/50 text-[#00A8E8] px-3 py-1.5 rounded transition-colors">Var 1</button>
                    <button onclick="app.setVariasi(2)" id="btn-var2" class="flex-1 sm:flex-none text-[10px] sm:text-xs font-bold uppercase tracking-wider bg-[#8A2BE2]/20 hover:bg-[#8A2BE2]/30 border border-[#8A2BE2]/50 text-[#8A2BE2] px-3 py-1.5 rounded transition-colors">Var 2</button>
                    <button onclick="app.setVariasi(0)" id="btn-var0" class="flex-1 sm:flex-none text-[10px] sm:text-xs font-bold uppercase tracking-wider bg-[#2A2D31] hover:bg-[#32363D] border border-[#3A3D41] text-[#E0E0E0] px-3 py-1.5 rounded transition-colors">Stop</button>
                    <button onclick="app.startVoice()" id="btn-voice" class="w-full sm:w-auto text-[10px] sm:text-xs font-bold uppercase tracking-wider bg-[#00FF41]/20 hover:bg-[#00FF41]/30 border border-[#00FF41]/50 text-[#00FF41] px-3 py-1.5 rounded transition-colors flex items-center justify-center gap-1">
                       <i class="ph ph-microphone text-sm"></i> Voice
                    </button>
                </div>
            </div>

            <!-- Relay Cards Generated via JS -->
            <div id="relays-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </div>

        <!-- Middle Section: Sensors & Variations (Left) + System Log (Right) -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 w-full relative">
            
            <!-- Left: Sensors & Variasi -->
            <div class="md:col-span-7 flex flex-col gap-6">
                <!-- Data Sensors (Temp / Hum) -->
                <div class="flex flex-col sm:flex-row gap-4 w-full">
                    <!-- Temperature Card -->
                    <div class="bg-[#16191D]/80 backdrop-blur-md border border-[#2A2D31] rounded-lg px-4 py-3 flex items-center shadow-2xl relative overflow-hidden flex-1">
                        <div class="absolute top-0 right-0 w-24 h-24 bg-[#FF4B2B]/5 rounded-full blur-2xl"></div>
                        <div class="flex items-center justify-center sm:justify-start gap-2 relative z-10 w-full">
                            <i class="ph ph-thermometer text-[#FF4B2B] text-lg"></i>
                            <span class="text-[10px] sm:text-xs uppercase text-[#8E9299] tracking-widest font-bold leading-none mt-0.5">Temperature : <span id="temp-val" class="text-white text-xs sm:text-sm ml-1 font-mono">--</span> °C</span>
                        </div>
                    </div>

                    <!-- Humidity Card -->
                    <div class="bg-[#16191D]/80 backdrop-blur-md border border-[#2A2D31] rounded-lg px-4 py-3 flex items-center shadow-2xl relative overflow-hidden flex-1">
                        <div class="absolute bottom-0 left-0 w-24 h-24 bg-[#00A8E8]/5 rounded-full blur-2xl"></div>
                        <div class="flex items-center justify-center sm:justify-start gap-2 relative z-10 w-full">
                            <i class="ph ph-drop text-[#00A8E8] text-lg"></i>
                            <span class="text-[10px] sm:text-xs uppercase text-[#8E9299] tracking-widest font-bold leading-none mt-0.5">Humidity : <span id="hum-val" class="text-white text-xs sm:text-sm ml-1 font-mono">--</span> %</span>
                        </div>
                    </div>
                </div>

                <!-- Chart Row -->
                <div class="bg-[#16191D]/80 backdrop-blur-md border border-[#2A2D31] rounded-xl p-4 sm:p-5 flex flex-col relative overflow-hidden shadow-2xl h-[160px]">
                    <div class="flex justify-between items-center mb-2 relative z-10 shrink-0">
                        <h2 class="text-[10px] sm:text-xs font-semibold uppercase tracking-widest text-[#8E9299] flex items-center gap-2">
                            <i class="ph ph-activity text-base text-[#00A8E8]"></i> Realtime History
                        </h2>
                        <span class="text-[9px] bg-[#2A2D31] px-2 py-0.5 rounded-md text-white font-mono border border-[#3A3D41]">DHT11 (PIN 4)</span>
                    </div>
                    
                    <div class="mt-1 w-full flex-1 relative z-10 min-h-0">
                        <canvas id="sensorChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Right: System Log -->
            <div class="md:col-span-5 bg-[#16191D] border border-[#2A2D31] rounded-lg p-5 sm:p-6 shadow-2xl flex flex-col md:h-[274px]">
                <h2 class="text-[11px] sm:text-xs font-semibold uppercase tracking-widest text-[#8E9299] mb-4 flex items-center gap-2">
                    <i class="ph ph-terminal-window text-[#E0E0E0] text-lg"></i> System Command Log
                </h2>
                <div id="log-container" class="font-mono text-[11px] sm:text-xs space-y-3 flex-1 overflow-y-auto leading-relaxed pr-2">
                    <!-- Logs injected via JS -->
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="p-4 border-t border-[#2A2D31] flex justify-between items-center text-[10px] text-[#8E9299] uppercase tracking-widest shrink-0 font-mono">
        <div class="hidden sm:block" id="realtime-clock">00:00:00</div>
        <div>Backend Sync: <span id="sync-status" class="text-[#E0E0E0]">Initializing...</span></div>
    </footer>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 top-auto md:top-24 md:bottom-auto right-4 md:right-6 flex flex-col gap-3 z-50 pointer-events-none"></div>

    <script type="module" src="/app.js"></script>
</body>
</html>
